app:
  env: dev
  default_quality_preset: cheap
  enable_human_review: false
  enable_image_audit: false
  enable_llm_audit: false
apikeys_file: ./apikeys.yaml
model_catalog_file: ./model_catalog.yaml.example
project:
  id: saodi_bashinian_terra_image2
  title: 扫地八十年，从宗门杂役飞升成仙
  script_outline_file: ./inputs/扫地八十年，从宗门杂役飞升成仙_第1集.txt
  episode_count: 1
  episode_duration_seconds: 150
  bgm_count: 1
output:
  root_dir: ./outputs
  project_dir_template: '{date}_{slug}'
  db_filename: autodrama.sqlite
  subdirs:
    logs: logs
    assets: assets
    outputs: outputs
    images: assets/images
    videos: assets/videos
    audios: assets/audios
    json: assets/json
runtime:
  python:
    windows: D:/miniforge3/envs/autodrama/python.exe
    linux: python3
    macos: python3
    default: python3
  max_text_retry: 3
  max_media_retry: 2
  request_timeout_seconds: 1200
  ffmpeg_path: ffmpeg
budget:
  max_total_cny: 100
  max_image_count: 100
  max_video_seconds: 180
  max_music_count: 5
  max_text_calls: 200
generation:
  expected_output_seconds: 60
  visual_style:
    schema_version: 2
    medium: stylized_3d_cg
    render_engine_language:
      - 高质感东方玄幻国漫短剧，风格化 CG 人物与清晰面部表演，整体明显非真人摄影。
      - 美术体系采用东方古典建筑、服饰与器物语言，结合克制的超自然氛围。
      - 所有具体人物、场景和物件均以剧本内容为准。
    materials: [精细织物, 青灰石材, 深色木材, 克制金属, 层次明确的能量材质]
    palette: [月白, 青灰, 墨蓝, 朱红对比色, 熔金对比色]
    lighting: [电影级体积光, 环境光与自发光关系稳定]
    camera: [强调人物关系与身份差异, 强调情绪转折, 竖屏空间压迫感]
    negative_constraints: [真人照片, 欧美奇幻造型, 夸张网游 UI, 廉价塑料皮肤, 可读文字, 水印, logo]
  roleboard_style_prompt: 使用参考图片统一东方古典衣冠结构、交领层次、冠发方式和人物仪态，并转译为高完成度3D国漫角色。脸部采用风格化CG表现，五官、年龄特征、体态和表情服务角色设定，但避免真人毛孔级写实。服装形制、材质、颜色、纹样、整洁程度和配饰必须依据角色的时代、年龄、身份、职业、阶层、性格与经历生成，不预设具体人物造型。背景干净，人物轮廓和服装层次清楚；除指定角色名和视图标签外，不出现其他文字、水印或logo。
  prop_design_style_prompt: 采用高质感东方玄幻3D国漫的通用道具设计语言。道具结构兼顾东方古典工艺、清晰功能逻辑和适度超自然想象；材料、纹样、磨损、制造精度、能量状态和使用方式必须符合其时代、用途、等级与持有者身份。织物、木材、石材、陶瓷、金属、药物和能量材质应有明确差异，环境光与自发光关系稳定。不预设具体道具类型，造型完整、比例准确、便于不同镜头复用。无人物、手持、可读文字、水印或logo。
  layout_design_style_prompt: 采用高质感东方玄幻3D国漫的通用场景设计语言。具体空间的建筑形制、自然环境、功能分区、尺度、陈设、通行关系和使用痕迹必须依据剧情地点生成，并在同一世界观中保持结构、材质和装饰体系一致。使用青灰石材、深色木构、冷白雾气与克制金属装饰建立空间基调，超自然光效根据剧情需要出现但不取代真实光照逻辑。场景需支持竖屏近景表演、多人调度、动作场面与能量效果，不预设具体地点或剧情事件。无人物、字幕、水印或logo。
postgen:
  max_source_clips_per_plan: 9
  render_width: 720
  render_height: 1280
  fps: 25
  burn_subtitles: true
  edit_plan_mode: deterministic
  keep_tmp_cuts: true
  voice_alignment:
    enabled: false
    demucs_model: htdemucs
    demucs_device: cpu
    diarization_model: pyannote/speaker-diarization-3.1
    huggingface_token_env: HUGGINGFACE_TOKEN
    speaker_role_map: {}
    role_rvc_models: {}
    speaker_rvc_models: {}
    rvc_command: []
    fail_on_unmapped_speaker: true
  subtitles:
    enabled: false
    backend: whisperx
    model: large-v3
    language: zh
    device: cpu
    compute_type: int8
    batch_size: 4
    max_chars_per_line: 18
    max_lines: 2
    font_name: Microsoft YaHei
  audit:
    enabled: true
    source_asr: true
    source_audit: true
    final_audit: true
    frame_count: 9
    include_audio: true
    fail_on_reject: false
    max_output_tokens: 8192
