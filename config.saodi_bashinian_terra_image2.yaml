      default_female_speaker: zh_female_xiaohe_uranus_bigtts
      role_speakers: {}
      emotion_instructions:
        normal:
          emotion: neutral
          emotion_scale: 2
          speech_rate: 0
          loudness_rate: 0
          instruction: 自然、克制、口语化，像影视短剧对白，保持角色身份感。
        tense:
          emotion: tension
          emotion_scale: 4
          speech_rate: 6
          loudness_rate: -2
          instruction: 压低声音，呼吸略紧，像强忍情绪，语尾收住，不要夸张表演。
        angry:
          emotion: angry
          emotion_scale: 4
          speech_rate: 5
          loudness_rate: 4
          instruction: 愤怒但不要吼叫，语气锋利，停顿短促，压迫感强。
        sad:
          emotion: sad
          emotion_scale: 4
          speech_rate: -8
