      default_female_speaker: zh_female_xiaohe_uranus_bigtts
      role_speakers: {}
      emotion_instructions:
        normal:
          emotion: neutral
          emotion_scale: 2
          speech_rate: 0
          loudness_rate: 0
          instruction: 自然、克制、口语化，像影视短剧对白，保持角色身份感。
        tense:
          emotion: tension
          emotion_scale: 4
          speech_rate: 6
          loudness_rate: -2
          instruction: 压低声音，呼吸略紧，像强忍情绪，语尾收住，不要夸张表演。
        angry:
          emotion: angry
          emotion_scale: 4
          speech_rate: 5
          loudness_rate: 4
          instruction: 愤怒但不要吼叫，语气锋利，停顿短促，压迫感强。
        sad:
          emotion: sad
          emotion_scale: 4
          speech_rate: -8
          loudness_rate: -4
          instruction: 低落、疲惫，语速稍慢，尾音略沉，带一点忍住不哭的感觉。
        happy:
          emotion: happy
          emotion_scale: 3
          speech_rate: 4
          loudness_rate: 2
          instruction: 轻松、有笑意，节奏明快，但不要广告腔。
        whisper:
          emotion: ASMR
          emotion_scale: 3
          speech_rate: -10
          loudness_rate: -8
          instruction: 贴近耳语，音量较低，气声更明显，但吐字保持清晰。
        low:
          emotion: neutral
          emotion_scale: 3
          speech_rate: -6
          loudness_rate: -4
          instruction: 压低声线，声音低沉克制，带私密感或压迫感，但不是耳语，吐字保持清晰。
        other:
          emotion: neutral
          emotion_scale: 2
          speech_rate: 0
          loudness_rate: 0
          instruction: 按角色设定自然表达，根据文本上下文微调情绪。
      speaker_id_pool: []
      poll_interval_seconds: 5
      max_polls: 60
      voice_clone_extra_params:
        voice_clone_denoise_model_id: ''
        enable_audio_denoise: false
