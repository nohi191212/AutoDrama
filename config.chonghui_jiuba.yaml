app:
  env: dev
  default_quality_preset: cheap
  enable_human_review: false
apikeys_file: ./apikeys.yaml
model_catalog_file: ./model_catalog.yaml.example
project:
  id: chonghui_jiuba
  title: 重回九八：我在小渔村兴风作浪
  script_outline_file: ./inputs/重回九八：我在小渔村兴风作浪.txt
  episode_count: 1
  episode_duration_seconds: 90
  bgm_count: 1
output:
  root_dir: ./outputs
  project_dir_template: '{date}_{slug}'
  db_filename: autodrama.sqlite
  subdirs:
    logs: logs
    assets: assets
    outputs: outputs
    images: assets/images
    videos: assets/videos
    audios: assets/audios
    json: assets/json
runtime:
  python:
    windows: D:/miniforge3/envs/autodrama/python.exe
    linux: python3
    macos: python3
    default: python3
  max_text_retry: 3
  max_media_retry: 2
  request_timeout_seconds: 1200
  ffmpeg_path: ffmpeg
budget:
  max_total_cny: 100
  max_image_count: 20
  max_video_seconds: 45
  max_music_count: 5
  max_text_calls: 200
generation:
  roleboard_style_reference_dir: ./.assets/roleboard_styles/urban_1998_fishing_village
  visual_style_prompt: 1990年代末中国南方沿海地区的年代写实短剧风格，采用仿真人电影摄影和朴素现实主义美学。人物、环境、服装与陈设具有可信的本土生活质感和严格的时代一致性。以自然光为主，使用克制的青灰、暖金和钨丝灯暖黄色彩，保留柔和高光、适度阴影层次和轻微35mm胶片颗粒。画面强调真实肤色、自然表演、生活磨损、潮湿空气和竖屏构图下的近距离情绪张力。所有具体人物、场景和物件均以剧本内容为准。避免超出时代的技术、产品、造型与装饰，避免网红妆、过度磨皮、赛博元素、可读文字、水印和logo。
  roleboard_style_prompt: 使用参考图片统一1990年代末中国南方沿海地区的真人电影质感、自然肤色、朴素造型、潮湿空气和纪实光线。角色呈可信的中国演员定妆照效果，保留自然面部结构和适度皮肤纹理，避免时尚大片式精修。服装款式、面料、颜色、磨损程度和生活状态必须符合角色的年龄、职业、经济状况与剧情时代，不预设具体人物造型。身份板背景简洁中性，人物轮廓、服装层次和材质清楚；除指定角色名和视图标签外，不出现其他文字、水印或logo。
  prop_design_style_prompt: 采用1990年代末中国南方沿海地区的生活写实设计语言。道具的结构、工艺、材质、使用痕迹和新旧程度必须符合其功能、持有者身份与剧情时代；常见天然材料、金属、织物、陶瓷和早期工业制品应具有清楚且可信的材质差异。造型完整、比例准确、便于不同镜头复用，不预设具体道具类型。避免超出时代的电子产品、设计语言、包装与工艺，不出现人物、手持、可读商标、水印或logo。
  layout_design_style_prompt: 采用1990年代末中国南方沿海地区的写实电影场景设计语言。建筑、自然环境、道路、室内陈设和公共设施必须符合具体地点的功能、经济条件、气候与时代背景，并保持统一可信的空间关系。强调潮湿空气、自然风化、生活痕迹和明确稳定的光线方向；空间需支持竖屏人物表演、动作调度与多种摄影机位，不预设具体地点或剧情事件。避免超出时代的设施与装饰，不出现人物、字幕、水印或logo。
postgen:
  max_source_clips_per_plan: 9
  render_width: 720
  render_height: 1280
  fps: 25
  burn_subtitles: true
  edit_plan_mode: deterministic
  keep_tmp_cuts: true
  voice_alignment:
    enabled: false
    demucs_model: htdemucs
    demucs_device: cpu
    diarization_model: pyannote/speaker-diarization-3.1
    huggingface_token_env: HUGGINGFACE_TOKEN
    speaker_role_map: {}
    role_rvc_models: {}
    speaker_rvc_models: {}
    rvc_command: []
    fail_on_unmapped_speaker: true
  subtitles:
    enabled: false
    backend: whisperx
    model: large-v3
    language: zh
    device: cpu
    compute_type: int8
    batch_size: 4
    max_chars_per_line: 18
    max_lines: 2
    font_name: Microsoft YaHei
  audit:
    enabled: true
    source_asr: true
    source_audit: true
    final_audit: true
    frame_count: 9
    include_audio: true
    fail_on_reject: false
    max_output_tokens: 8192
