app:
  env: dev
  default_quality_preset: cheap
  enable_human_review: false

apikeys_file: ./apikeys.yaml
model_catalog_file: ./model_catalog.yaml.example

project:
  # Stable ID is recommended because resume relies on it.
  id: huyao
  title: 狐妖太会撩，我靠吓哭游客狂赚千亿
  script_outline_file: ./inputs/狐妖.md
  # The script pipeline lets the text model split the story into this many episodes.
  episode_count: 1
  # Target duration for each episode, in seconds.
  episode_duration_seconds: 180
  # Exact number of reusable BGM tracks; set 0 to skip BGM design/generation.
  bgm_count: 1
output:
  # All generated assets are saved under this directory.
  # Relative paths are resolved from the working directory.
  root_dir: ./outputs
  project_dir_template: "{date}_{slug}"
  db_filename: autodrama.sqlite
  subdirs:
    logs: logs
    assets: assets
    outputs: outputs
    images: assets/images
    videos: assets/videos
    audios: assets/audios
    json: assets/json

runtime:
  python:
    # The key is selected by scripts/env.sh after platform detection.
    # Supported keys: windows, macos, linux, default.
    windows: D:/miniforge3/envs/autodrama/python.exe
    linux: python3
    macos: python3
    default: python3
  max_text_retry: 3
  max_media_retry: 2
  request_timeout_seconds: 1200
  ffmpeg_path: ffmpeg

budget:
  max_total_cny: 100
  max_image_count: 20
  max_video_seconds: 45
  max_music_count: 5
  max_text_calls: 200

generation:
  # Used by roleboard_generation as Image 2 style references.
  roleboard_style_reference_dir: ./.assets/sample_urban_fantasy
  # Global visual style prompt used by design_key_vision_prompt.
  visual_style_prompt: >
    爱死机动画剧集美学风格，超精细写实CGI动画，电影级戏剧性布光，强烈的明暗对照，高对比度赛博朋克色调，体积雾与丁达尔光束穿透黑暗，复杂精细的表面纹理，清晰聚焦与深景深，虚幻引擎5渲染，4K画质，电影海报级构图，宏大科幻氛围。明确主体、纵深层次、戏剧冲突、
    稳定光影方向和统一色彩关系。
  # Unified role image style prompt used by roleboard_prompt and roleboard_generation.
  roleboard_style_prompt: >
    使用参考图片作为统一人物美术风格、材质质感、光影、色彩和画面气质参考。
    人物保持超精细写实CGI动画质感，脸部为风格化CG表现，避免真人照片级毛孔瑕疵。
    重点表现“现代都市”与“系统全息”元素的融合，支持新中式服装、现代常服与古风元素的混搭。
    保留衣物布料、金属配饰的区别，并在AI/系统类角色身上增加轻微的数字粒子、全息投影或边缘发光特效。
    背景保持干净，除指定角色名和视图标签外，不出现其他文字、水印或logo。
  prop_design_style_prompt: >
    道具图保持超精细写实CGI动画质感，材质区分清楚，轮廓完整可读；
    兼顾古风神话造物（如青铜、玉石、残破古卷）与系统全息造物（如发光的令牌、数据流态物品）。
    光影干净，背景简洁，无人物、无手持、无文字、水印或logo。重点表现尺寸比例、
    材质磨损、危险气息（如血迹、锈迹）以及系统激活时的能量发光状态。
  layout_design_style_prompt: >
    场景图保持超精细写实CGI动画无人物场景三视图设定板质感，空间结构清晰，顶视平面、正向主视和侧向/45度透视必须统一为同一个空间。
    三视图用于后续9:16短剧取景参考，需要清楚展示入口、墙面、地面、天花、固定装置、角色站位区域、摄影机可站位区域和关键道具摆放区域。
    重点突出“沉浸式惊悚密室”与“全息重构”的氛围感，强化环境光影对比（如幽暗冷色调环境与红灯笼等诡异暖光源的碰撞）。
    材质需体现出现代废墟、古老遗迹与幻象交叠的视觉差，光源、阴影和空气粒子（如灰尘、悬浮光点）关系稳定可复用。
    不出现人物、背影、手、剪影、字幕、水印、文字标识或无关logo。

postgen:
  max_source_clips_per_plan: 9
  render_width: 720
  render_height: 1280
  fps: 25
  burn_subtitles: true
  edit_plan_mode: llm
  keep_tmp_cuts: true

# Node-level model bindings. If a node is omitted here, AutoDrama falls back to the legacy routing section.
# Params are validated against model_catalog_file when the config is loaded.
nodes:
  script_outline:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
  script_novel:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.7
      response_format: json_object
  script_novel_extract:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.3
      response_format: json_object
  director_prep:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
  design_key_vision_prompt:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.45
      response_format: json_object
  design_key_vision_image:
    model: aibox:gpt-image-2
    params:
      size: "9:16"
      resolution: 4K
      n: 1
      response_format: url
  role_extract_primary:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.3
      response_format: json_object
  role_extract_functional:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.3
      response_format: json_object
  role_episode_key_audit:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.2
      response_format: json_object
  role_duplicate_audit:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.2
      response_format: json_object
  ambient_entity_extract:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.3
      response_format: json_object
  roleboard_prompt:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
  roleboard_generation:
    model: aibox:gpt-image-2
    params:
      roleboard_prompt_template: roleboard_prompt/toapi_gpt_image_2_high
      roleboard_generation_concurrency: 3
      size: "16:9"
      resolution: 4K
      n: 1
      response_format: url
  storyboard_prompt:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
      console_stream: false
  # Image binding used internally by pregen node storyboard_generation for the 12-panel storyboard sheet.
  storyboard_sheet_generation:
    model: aibox:gpt-image-2
    params:
      storyboard_generation_concurrency: 4
      size: "1:1"
      resolution: 4K
      n: 1
      response_format: url
  storyboard_keyframe_generation:
    model: aibox:gpt-image-2
    params:
      prompt_template: toapi_gpt_image_2
      size: "9:16"
      resolution: 2K
      n: 1
      response_format: url
      concurrency: 4
      output_dir: assets/storyboard_keyframes
  prop_extract:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.3
      response_format: json_object
  prop_dedupe:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.2
      response_format: json_object
      max_iterations: 8
  prop_prompt:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
  prop_image_generation:
    model: aibox:gpt-image-2
    params:
      size: "1:1"
      resolution: 2K
      n: 1
      response_format: url
      prop_image_generation_concurrency: 3
  layout_extract:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.3
      response_format: json_object
  layout_prompt:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
  layout_dedupe_review:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.2
      response_format: json_object
      max_iterations: 8
  layout_image_generation:
    model: aibox:gpt-image-2
    params:
      size: "16:9"
      resolution: 4K
      n: 1
      response_format: url
      concurrency: 3
  bgm_design:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: xhigh
      temperature: 0.4
      response_format: json_object
  bgm_generation:
    model: minimax:music-2.6
    params:
      format: mp3
      sample_rate: 44100
      output_format: url
      is_instrumental: true
  role_subject_video_generation:
    model: kling:kling-v3-omni
    params:
      aspect_ratio: "9:16"
      mode: pro
      sound: "on"
      watermark: false
      max_reference_images: 2
      max_reference_elements: 3
      role_subject_video_generation_concurrency: 5
  role_subject_video_intro_text:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: low
      temperature: 0.5
      response_format: json_object
  role_subject_element_generation:
    model: kling:kling-v3-omni
    params:
      aspect_ratio: "9:16"
      mode: pro
      sound: "off"
      watermark: false
  clip_video_generation:
    model: kling:kling-v3-omni
    params:
      aspect_ratio: "9:16"
      mode: pro
      sound: "on"
      watermark: false
      prompt_template: clip_video/kling
      negative_rules:
        - 无字幕、无logo、无水印、无分格线、无面板编号、不要直接展示场景三视图、人物三视图。
      max_reference_images: 3
      clip_video_generation_concurrency: 5
  shot_dialogue_audio_generation:
    model: volcengine:seed-tts-2.0
    params:
      sample_rate: 24000
      response_format: mp3
      max_generated_audio_duration_seconds: 10
  role_voice_select:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: low
      temperature: 0.2
      response_format: json_object
  role_voice_select_audio_judge:
    model: aliyun_omni:qwen3.5-omni-plus
    params:
      temperature: 0.2
  image_prompt_safety_rewrite:
    model: rightcode:gpt-5.5
    params:
      reasoning_effort: low
      temperature: 0.2
      response_format: json_object
  postgen_edit_plan_generation:
    model: google:gemini-3.5-flash
    params:
      temperature: 0.2
      response_format: json_object

providers:
  aliyun:
    base_url: https://dashscope.aliyuncs.com
    api_key_env: ALIYUN_API_KEY
    models:
      text: qwen-plus
      voice_design: voice-enrollment
      voice_clone: voice-enrollment
      target_model: qwen3-tts-vd-2026-01-26
      clone_target_model: qwen3-tts-vc-2026-01-22
      vision: qwen-vl-max
      omni: qwen-omni-turbo
      music: fun-music-v1
      image: wan2.7-image-pro
      text_to_video: wan2.7-t2v-2026-04-25
    options:
      text_response_format: true
      language: zh
      sample_rate: 24000
      response_format: wav
      websocket_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
      music_format: mp3
      music_gender: female
      enable_aigc_watermark: false
      image_size: 2K
      n: 1
      thinking_mode: true
      resolution: 720P
      ratio: "16:9"
      prompt_extend: true
      watermark: false
      poll_interval_seconds: 15
      max_polls: 80

  aliyun_omni:
    base_url: https://dashscope.aliyuncs.com
    api_key_env: ALIYUN_API_KEY
    models:
      audio_judge: qwen3.5-omni-plus
    options:
      omni_response_format: false

  rightcode:
    base_url: https://www.right.codes/draw
    api_key_env: RIGHTCODE_API_KEY
    models:
      text: gpt-5.5
      storyboard: gpt-5.5
      image: gpt-image-2
      # Used by design_key_vision_image for the global key visual original.
      key_vision: gpt-image-2
      # Used by roleboard_generation for role identity boards.
      roleboard: gpt-image-2-vip
    options:
      text_response_format: true
      reasoning_effort: xhigh
      storyboard_reasoning_effort: xhigh
      size: 1024x1024
      # Used by roleboard_generation for role identity boards.
      roleboard_size: 3840x2160
      roleboard_quality: high
      # Used by design_key_vision_image for the global key visual original.
      key_vision_size: 1024x1536
      key_vision_quality: high
      n: 1

  aibox:
    base_url: https://api.lk888.ai
    api_key_env: AIBOX_API_KEY
    models:
      image: gpt-image-2
      key_vision: gpt-image-2
      roleboard: gpt-image-2
      storyboard: gpt-image-2
      prop: gpt-image-2
      layout: gpt-image-2
    options:
      size: auto
      quality: auto
      response_format: url
      n: 1
      key_vision_size: "9:16"
      key_vision_resolution: 4K
      roleboard_size: "16:9"
      roleboard_resolution: 4K
      storyboard_size: "1:1"
      storyboard_resolution: 2K
      prop_size: "1:1"
      prop_resolution: 2K
      layout_size: "9:16"
      layout_resolution: 4K
      max_reference_images: 10
      aibox_request_timeout_seconds: 240
      aibox_max_attempts: 3
      aibox_retry_initial_delay_seconds: 2
      aibox_retry_max_delay_seconds: 30
      poll_interval_seconds: 4
      max_wait_seconds: 900

  toapi:
    base_url: https://toapis.com
    api_key_env: TOAPI_API_KEY
    models:
      image: gpt-image-2
      # Used by design_key_vision_image for the global key visual original.
      key_vision: gpt-image-2
      # Used by roleboard_generation for the final 16:9 role identity board.
      roleboard: gpt-image-2
    options:
      resolution: 4K
      size: "16:9"
      roleboard_size: "16:9"
      roleboard_resolution: 4K
      key_vision_size: "9:16"
      key_vision_resolution: 4K
      prop_size: "1:1"
      prop_resolution: 2K
      prop_image_generation_concurrency: 3
      layout_size: "9:16"
      layout_resolution: 4K
      response_format: url
      n: 1
      toapi_max_attempts: 10
      toapi_retry_initial_delay_seconds: 2
      toapi_retry_max_delay_seconds: 30
      poll_interval_seconds: 3
      max_wait_seconds: 900

  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    models:
      text: deepseek-v4-pro
      storyboard: deepseek-v4-pro
    options:
      reasoning_effort: max
      thinking_enabled: true
      storyboard_reasoning_effort: max
      storyboard_thinking_enabled: true

  google:
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GOOGLE_API_KEY
    models:
      text: gemini-3.5-flash
      postgen_edit_plan: gemini-3.5-flash
    options:
      response_format: json_object
      temperature: 0.2
      max_output_tokens: 8192

  minimax:
    base_url: https://api.minimaxi.com
    api_key_env: MINIMAX_API_KEY
    group_id_env: MINIMAX_GROUP_ID
    models:
      tts: speech-02
      music: music-2.6
    options:
      music_format: mp3
      music_sample_rate: 44100
      music_bitrate: 256000
      output_format: url
      is_instrumental: true
      lyrics_optimizer: false
      aigc_watermark: false
      music_timeout_seconds: 600

  elevenlabs:
    base_url: https://api.elevenlabs.io
    api_key_env: ELEVENLABS_API_KEY
    models:
      music: music_v1
    options:
      output_format: mp3_44100_128
      force_instrumental: true
      respect_sections_durations: true
      music_timeout_seconds: 600

  volcengine:
    base_url: https://openspeech.bytedance.com
    region: cn-beijing
    api_key_env: VOLCENGINE_API_KEY
    app_id_env: VOLCENGINE_APP_ID
    access_key_env: VOLCENGINE_ACCESS_KEY
    secret_key_env: VOLCENGINE_SECRET_KEY
    models:
      speech_synthesis: seed-tts-2.0
      speech_synthesis_fallback: seed-tts-1.0
      voice_design: voice_design
      voice_clone: voice_clone
      tts: seed-icl-2.0
      target_model: seed-icl-2.0
      clone_target_model: seed-icl-2.0
      image: doubao-seedream-5-0-260128
      key_vision: doubao-seedream-5-0-260128
      seedream_5: doubao-seedream-5-0-260128
      seedream_5_lite: doubao-seedream-5-0-lite-260128
      video: doubao-seedance-2-0-260128
      seedance_2: doubao-seedance-2-0-260128
      upscale: video-upscale
    options:
      language: cn
      sample_rate: 24000
      response_format: mp3
      max_generated_audio_duration_seconds: 10
      role_voice_preview_text_chars: 40
      seed_tts_api_key_env: SEED_TTS_API_KEY
      seedream_base_url: https://ark.cn-beijing.volces.com
      seedream_api_key_env: VOLCENGINE_API_KEY
      seedream_image_size: 1600x2848
      seedream_key_vision_size: 1600x2848
      seedream_roleboard_size: 2848x1600
      seedream_prop_size: 2048x2048
      seedream_layout_size: 1600x2848
      seedream_output_format: png
      seedream_response_format: url
      seedream_watermark: false
      seedream_sequential_image_generation: disabled
      seedream_max_reference_images: 14
      seedance_base_url: https://ark.cn-beijing.volces.com
      seedance_api_key_env: VOLCENGINE_API_KEY
      video_ratio: "9:16"
      video_resolution: 720p
      # Seedance video refs are prepared by clip_manifest_generation as fixed clip_video_inputs.
      # clip_video_generation submits clip_start_frame, clip_end_frame, storyboard, then roleboard/layout/prop refs.
      # Previous generated videos, audio refs, and key vision are not part of the fixed shot video contract.
      video_reference_mode: full
      previous_video_preroll_seconds: 0
      # max_reference_* values are kept as provider limits; fixed inputs are never silently truncated.
      max_reference_images: 4
      max_reference_audio: 1
      max_reference_audio_duration_seconds: 15.2
      max_reference_videos: 2
      max_reference_video_total_duration_seconds: 15.2
      video_poll_interval_seconds: 30
      return_last_frame: true
      generate_audio: false
      video_min_duration_seconds: 4
      video_max_duration_seconds: 10
      tts_resource_id: seed-tts-2.0
      tts_fallback_resource_id: seed-tts-1.0
      instruction_mode: none
      additions_as_json_string: true
      default_speaker: zh_male_m191_uranus_bigtts
      default_male_speaker: zh_male_m191_uranus_bigtts
      default_female_speaker: zh_female_xiaohe_uranus_bigtts
      role_speakers: {}
      emotion_instructions:
        normal:
          emotion: neutral
          emotion_scale: 2
          speech_rate: 0
          loudness_rate: 0
          instruction: 自然、克制、口语化，像影视短剧对白，保持角色身份感。
        tense:
          emotion: tension
          emotion_scale: 4
          speech_rate: 6
          loudness_rate: -2
          instruction: 压低声音，呼吸略紧，像强忍情绪，语尾收住，不要夸张表演。
        angry:
          emotion: angry
          emotion_scale: 4
          speech_rate: 5
          loudness_rate: 4
          instruction: 愤怒但不要吼叫，语气锋利，停顿短促，压迫感强。
        sad:
          emotion: sad
          emotion_scale: 4
          speech_rate: -8
          loudness_rate: -4
          instruction: 低落、疲惫，语速稍慢，尾音略沉，带一点忍住不哭的感觉。
        happy:
          emotion: happy
          emotion_scale: 3
          speech_rate: 4
          loudness_rate: 2
          instruction: 轻松、有笑意，节奏明快，但不要广告腔。
        whisper:
          emotion: ASMR
          emotion_scale: 3
          speech_rate: -10
          loudness_rate: -8
          instruction: 贴近耳语，音量较低，气声更明显，但吐字保持清晰。
        low:
          emotion: neutral
          emotion_scale: 3
          speech_rate: -6
          loudness_rate: -4
          instruction: 压低声线，声音低沉克制，带私密感或压迫感，但不是耳语，吐字保持清晰。
        other:
          emotion: neutral
          emotion_scale: 2
          speech_rate: 0
          loudness_rate: 0
          instruction: 按角色设定自然表达，根据文本上下文微调情绪。
      # Only used by the legacy Volcengine voice design/clone provider.
      speaker_id_pool: []
      poll_interval_seconds: 5
      max_polls: 60
      voice_clone_extra_params:
        voice_clone_denoise_model_id: ""
        enable_audio_denoise: false

  kling:
    base_url: https://api-beijing.klingai.com
    api_key_env: KLING_API_KEY
    models:
      video: kling-v3-omni
      subject_element: advanced-custom-elements
    options:
      mode: pro
      aspect_ratio: "9:16"
      duration: 5
      sound: "off"
      watermark: false
      video_reference_mode: subject_storyboard_key_vision
      subject_reference_type: video_refer
      subject_video_duration_seconds: 5
      max_reference_images: 3
