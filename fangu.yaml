app:
  env: dev
  default_quality_preset: cheap
  enable_human_review: false
  enable_image_audit: false
  enable_llm_audit: false
apikeys_file: ./apikeys.yaml
model_catalog_file: ./model_catalog.yaml.example
project:
  id: fangu_0903
  title: 凡骨镇天
  script_chapters_dir: ./inputs/fangu_first_3_chapters
  episode_count: 3
  episode_duration_seconds: 150
  bgm_count: 0
output:
  root_dir: ./outputs
  project_dir_template: '{date}_{slug}'
  db_filename: autodrama.sqlite
  subdirs:
    logs: logs
    assets: assets
    outputs: outputs
    images: assets/images
    videos: assets/videos
    audios: assets/audios
    json: assets/json
runtime:
  python:
    windows: D:/miniforge3/envs/autodrama/python.exe
    linux: python3
    macos: python3
    default: python3
  max_text_retry: 5
  max_media_retry: 2
  request_timeout_seconds: 1200
  # Text providers retry transient connection, timeout, proxy/TLS, and 5xx failures.
  text_retry_initial_delay_seconds: 2
  text_retry_max_delay_seconds: 30
  ffmpeg_path: ffmpeg
budget:
  max_total_cny: 100
  max_image_count: 100
  max_video_seconds: 45
  max_music_count: 0
  max_text_calls: 200
generation:
  roleboard_spatial_template_path: ./.assets/image_templates/roleboard_template.png
  visual_style: cyberpunk-wuxia-live-action-v1
  roleboard_style_prompt: 真人电影级超写实人物摄影，赛博朋克与武侠融合的赛博修真世界。使用真实成年演员比例、自然面部不对称、真实皮肤毛孔、汗液、伤口、织物、皮革和金属磨损；禁止动漫脸、游戏建模脸、Q版、插画、3DCG国漫质感。服装融合破旧工装、东方武侠剪裁、功能性义体接口与克制的仙朝元素，必须符合人物阶层、职业和战斗用途。底层废肢街使用煤黑、铁锈红、污水灰与幽蓝灵能管道；肉身道元息使用克制暗金色，从人体骨骼和皮肤内部透出，不使用夸张光污染。真实电影摄影机、低照度、高反差、物理可信光照，保留暗部细节与皮肤纹理，避免均匀柔光、棚拍美容光、过度磨皮和廉价霓虹。画面应像一部真人拍摄的赛博朋克武侠电影，沉重、肮脏、克制、可触摸，不复制任何具体参考人物或构图。
  prop_design_style_prompt: 真人电影级超写实道具设计，融合赛博朋克工业制造、东方武侠器物和赛博修真能量系统。明确呈现真实材质、加工痕迹、锈蚀、油污、划痕、维修拼接和功能逻辑；义体、灵能管道、废铁武器、玉片、药罐与刻名石碑必须具有可触摸的重量和使用历史。能量发光克制，服从真实光照，不要悬浮装饰、国漫纹样堆砌、文字、水印或logo。
  layout_design_style_prompt: 真人电影级超写实场景设计，建立垂直化赛博仙朝的空间逻辑：底层废肢街、下城区、中城、上城、三司浮空岛与天外区层层压迫。融合锈蚀工业设施、灵能管道、东方武侠建筑比例、地下矿道、贫民市场和冷峻仙朝机构。场景必须有真实尺度、潮湿污水、煤灰、金属磨损、维修痕迹、拥挤动线与可供真人表演的空间；幽蓝灵能和暗金元息严格服从真实光照，不要国漫卡通化、无意义霓虹、字幕、水印或logo。
postgen:
  max_source_clips_per_plan: 9
  fps: 25
  burn_subtitles: true
  edit_plan_mode: deterministic
  keep_tmp_cuts: true
  voice_alignment:
    enabled: false
    demucs_model: htdemucs
    demucs_device: cpu
    diarization_model: pyannote/speaker-diarization-3.1
    huggingface_token_env: HUGGINGFACE_TOKEN
    speaker_role_map: {}
    role_rvc_models: {}
    speaker_rvc_models: {}
    rvc_command: []
    fail_on_unmapped_speaker: true
  subtitles:
    enabled: false
    backend: whisperx
    model: large-v3
    language: zh
    device: cpu
    compute_type: int8
    batch_size: 4
    max_chars_per_line: 18
    max_lines: 2
    font_name: Microsoft YaHei
  audit:
    enabled: false
    source_asr: false
    source_audit: false
    final_audit: false
    frame_count: 9
    include_audio: true
    fail_on_reject: false
    max_output_tokens: 8192
