[project]
name = "autodrama"
version = "0.1.0"
description = "AutoDrama MVP pipeline up to role voice generation."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
  "dashscope>=1.20",
  "httpx>=0.25",
  "openai>=1.0",
  "Pillow>=10",
  "pydub>=0.25",
]

[project.optional-dependencies]
postgen-audio = [
  "demucs>=4.0,<5",
  "pyannote.audio>=3.1,<4",
  "whisperx>=3.3,<4",
]

[project.scripts]
autodrama = "autodrama.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodrama = [
  "prompts/*.md",
  "prompts/image_asset_audit/*.md",
  "prompts/key_vision_prompt/*.md",
  "prompts/key_vision_image_audit/*.md",
  "prompts/roleboard_prompt/*.md",
  "prompts/clip_video/*.md",
  "prompts/visual_styles/*.md",
  "prompts/image_rubrics/*.json",
  "prompts/image_rubrics/*.md",
  "providers/volcengine/audio/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
