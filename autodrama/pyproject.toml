[project]
name = "autodrama"
version = "0.1.0"
description = "AutoDrama MVP pipeline up to role voice generation."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
  "dashscope>=1.20",
  "httpx>=0.25",
  "openai>=1.0",
  "Pillow>=10",
]

[project.scripts]
autodrama = "autodrama.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodrama = [
  "prompts/*.md",
  "prompts/roleboard_prompt/*.md",
  "prompts/shot_video/*.md",
  "providers/volcengine/audio/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
