[project]
name = "autodrama"
version = "0.1.0"
description = "AutoDrama MVP pipeline up to role voice design."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
  "httpx>=0.25",
]

[project.scripts]
autodrama = "autodrama.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autodrama = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
